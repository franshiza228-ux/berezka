<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Достижения 2021-2022 — БЕРЁЗКА</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #fdfdfd; margin: 0; padding: 40px 20px; }
        h1 { text-align: center; color: #2d5a27; margin-bottom: 50px; font-size: 2.5rem; }
        .achievements-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 30px; max-width: 1200px; margin: 0 auto; 
        }
        .diploma-frame {
            background: #fff; padding: 10px; border: 10px solid #5d4037;
            outline: 2px solid #d4af37; box-shadow: 8px 8px 20px rgba(0,0,0,0.15);
            transition: transform 0.3s ease; cursor: pointer;
        }
        .diploma-frame:hover { transform: scale(1.03); }
        .diploma-inner { background: #f9f9f9; height: 380px; border: 1px solid #eee; overflow: hidden; }
        .diploma-inner img { width: 100%; height: 100%; object-fit: contain; }
        
        .back-btn { 
            display: block; width: fit-content; margin: 50px auto; 
            padding: 12px 35px; background: #3e7b37; color: white; 
            text-decoration: none; border-radius: 50px; font-weight: bold; 
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); display: none;
            justify-content: center; align-items: center; z-index: 2000; cursor: zoom-out;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-overlay img { max-width: 90%; max-height: 90%; object-fit: contain; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <h1>Достижения 2021–2022 годов</h1>

    <div class="achievements-grid">
        <div class="diploma-frame"><div class="diploma-inner"><img src="2021-2022/1000018815.jpg" alt="Грамота"></div></div>
        <div class="diploma-frame"><div class="diploma-inner"><img src="2021-2022/1000018816.jpg" alt="Грамота"></div></div>
        <div class="diploma-frame"><div class="diploma-inner"><img src="2021-2022/1000018817.jpg" alt="Грамота"></div></div>
        <div class="diploma-frame"><div class="diploma-inner"><img src="2021-2022/1000018818.jpg" alt="Грамота"></div></div>
        <div class="diploma-frame"><div class="diploma-inner"><img src="2021-2022/1000018819.jpg" alt="Грамота"></div></div>
        <div class="diploma-frame"><div class="diploma-inner"><img src="2021-2022/1000018820.jpg" alt="Грамота"></div></div>
        <div class="diploma-frame"><div class="diploma-inner"><img src="2021-2022/1000018821.jpg" alt="Грамота"></div></div>
        <div class="diploma-frame"><div class="diploma-inner"><img src="2021-2022/1000018822.jpg" alt="Грамота"></div></div>
    </div>

    <a href="about.html" class="back-btn">Назад на общую страницу</a>

    <div class="modal-overlay" id="modalOverlay">
        <img src="" id="modalImg" alt="Увеличенное изображение">
    </div>

    <script>
        const overlay = document.getElementById('modalOverlay');
        const modalImg = document.getElementById('modalImg');

        document.querySelectorAll('.diploma-frame img').forEach(img => {
            img.parentElement.parentElement.addEventListener('click', () => {
                modalImg.src = img.src;
                overlay.classList.add('active');
            });
        });

        overlay.addEventListener('click', () => {
            overlay.classList.remove('active');
        });
    </script>
</body>
</html>
