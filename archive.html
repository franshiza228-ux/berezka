<head>

    <style>
        body { overflow-wrap: break-word; word-break: break-word;  overflow-wrap: break-word; word-break: break-word;  font-family: 'Segoe UI', sans-serif; background: #fdfdfd; text-align: center; margin: 0; padding: 60px 20px; }
        h1 { color: #2d5a27; font-size: 2.5rem; margin-bottom: 20px; }
        .description { color: #666; margin-bottom: 50px; }
        
        .year-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); 
            gap: 25px; max-width: 1100px; margin: 0 auto; 
        }
        
        .year-tab {
            background: white; border: 2px solid #e0eee0; border-radius: 15px;
            padding: 50px 20px; text-decoration: none; color: #2d5a27;
            font-size: 1.8rem; font-weight: bold; transition: 0.4s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        
        .year-tab span { font-size: 0.9rem; color: #d4af37; margin-top: 10px; text-transform: uppercase; }

        .year-tab:hover {
            transform: translateY(-8px); border-color: #d4af37;
            box-shadow: 0 12px 25px rgba(0,0,0,0.1); color: #d4af37;
        }
        
        .back-home { display: inline-block; margin-top: 60px; color: #3e7b37; text-decoration: none; font-weight: bold; }
    </style>
</head>

        </a>

    <a href="index.html" class="back-home">← На главную</a>

</html>
